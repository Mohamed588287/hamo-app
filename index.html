<!-- 🔥 UI تحسينات -->
<style>
button:hover {
  transform: scale(1.05);
  box-shadow: 0 0 10px rgba(255,255,255,0.5);
}

.card {
  transition:0.3s;
}
.card:hover {
  transform:translateY(-3px);
  box-shadow:0 5px 15px rgba(0,0,0,0.5);
}

/* 🏆 leaderboard */
.leaderboard {
  background:#1e293b;
  margin:20px;
  padding:15px;
  border-radius:12px;
}
.light .leaderboard {background:#fff;}

.leader-item {
  display:flex;
  justify-content:space-between;
  padding:5px;
  border-bottom:1px solid #444;
}
</style>

<!-- 🏆 Ranking -->
<div class="leaderboard">
  <h3>🏆 أفضل المستخدمين</h3>
  <div id="leaderboard"></div>
</div>

<script>

/* 🏆 تحميل الرانكينج */
async function loadLeaderboard(){
  const snapshot = await db.collection("users").get();

  let users = [];

  snapshot.forEach(doc=>{
    let data = doc.data();
    let days = data.days || [];
    let score = 0;

    days.forEach(day=>{
      Object.values(day||{}).forEach(v=>{
        if(v) score++;
      });
    });

    users.push({
      email: data.email || "مستخدم",
      score: score
    });
  });

  users.sort((a,b)=>b.score-a.score);

  let html="";
  users.slice(0,5).forEach((u,i)=>{
    html+=`
    <div class="leader-item">
      <span>🥇 ${i+1}</span>
      <span>${u.email}</span>
      <span>${u.score}</span>
    </div>`;
  });

  document.getElementById("leaderboard").innerHTML=html;
}

/* تعديل login عشان نخزن الإيميل */
function login(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res=>{
    userId=res.user.uid;
    document.getElementById("user").innerText=res.user.email;

    db.collection("users").doc(userId).set({
      email: res.user.email
    },{merge:true});

    load();
    loadLeaderboard();
  });
}

/* استدعاء الرانكينج بعد التحميل */
setTimeout(()=>{
  if(userId) loadLeaderboard();
},2000);

</script>
