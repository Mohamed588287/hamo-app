<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>تحدي 21 يوم</title>

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <style>
    body { background:#0f172a; color:white; text-align:center; font-family:Arial; }
    .box { background:#1e293b; margin:10px; padding:10px; border-radius:10px; }
    button { padding:8px; margin:5px; border:none; border-radius:6px; cursor:pointer; }
    .done { background:green; }
    .not { background:red; }
  </style>
</head>

<body>

<h1>🔥 تحدي 21 يوم</h1>

<button onclick="login()">تسجيل بجوجل</button>
<p id="user"></p>

<div id="days"></div>

<script>
  const firebaseConfig = {
    apiKey: "AIzaSyD7XzFMve-N8ALJPlxaBQM_iMZtbr05dCc",
    authDomain: "hamo-124d8.firebaseapp.com",
    projectId: "hamo-124d8",
    storageBucket: "hamo-124d8.firebasestorage.app",
    messagingSenderId: "487641126653",
    appId: "1:487641126653:web:6378be437f6d0cb94fd094"
  };

  firebase.initializeApp(firebaseConfig);

  const auth = firebase.auth();
  const db = firebase.firestore();

  let userId = "";

  function login() {
    const provider = new firebase.auth.GoogleAuthProvider();
    auth.signInWithPopup(provider).then(res => {
      userId = res.user.uid;
      document.getElementById("user").innerText = res.user.email;
      load();
    }).catch(err => {
      alert(err.message);
    });
  }

  async function load() {
    const doc = await db.collection("users").doc(userId).get();
    let data = doc.exists ? doc.data().days : [];

    let html = "";
    for (let i = 0; i < 21; i++) {
      let d = data[i] || { study:false, work:false };

      html += `
      <div class="box">
        <h3>اليوم ${i+1}</h3>
        <button class="${d.study?'done':'not'}" onclick="toggle(${i},'study')">📚</button>
        <button class="${d.work?'done':'not'}" onclick="toggle(${i},'work')">💻</button>
      </div>`;
    }

    document.getElementById("days").innerHTML = html;
  }

  async function toggle(i,type){
    const ref = db.collection("users").doc(userId);
    const doc = await ref.get();

    let data = doc.exists ? doc.data().days : [];
    if(!data[i]) data[i]={study:false,work:false};

    data[i][type] = !data[i][type];

    await ref.set({days:data});
    load();
  }
</script>

</body>
</html>
