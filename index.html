<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🔥 تحدي 21 يوم</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  font-family: 'Cairo', sans-serif;
  background: linear-gradient(135deg,#0f172a,#020617);
  color: white;
  text-align: center;
}

.container {
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

h1 {
  margin-bottom: 10px;
}

button {
  padding: 10px;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: 0.3s;
}

button:hover {
  transform: scale(1.05);
}

.google {
  background: #4285F4;
  color: white;
}

.card {
  background: #1e293b;
  margin: 10px;
  padding: 15px;
  border-radius: 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.done { background: #22c55e; }
.not { background: #ef4444; }

.progress {
  background: #334155;
  border-radius: 10px;
  overflow: hidden;
  margin: 20px 0;
}

.progress-bar {
  height: 20px;
  background: #22c55e;
  width: 0%;
}
</style>
</head>

<body>

<div class="container">

<h1>🔥 تحدي 21 يوم</h1>
<p>ابدأ انضباطك من النهارده 💪</p>

<button class="google" onclick="login()">تسجيل بجوجل</button>
<p id="user"></p>

<div class="progress">
  <div id="bar" class="progress-bar"></div>
</div>

<div id="days"></div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyD7XzFMve-N8ALJPlxaBQM_iMZtbr05dCc",
  authDomain: "hamo-124d8.firebaseapp.com",
  projectId: "hamo-124d8"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let userId = "";

function login() {
  const provider = new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res => {
    userId = res.user.uid;
    document.getElementById("user").innerText = res.user.email;
    load();
  });
}

async function load() {
  const doc = await db.collection("users").doc(userId).get();
  let data = doc.exists ? doc.data().days : [];

  let html = "";
  let doneDays = 0;

  for (let i = 0; i < 21; i++) {
    let d = data[i] || { study:false, work:false };

    if(d.study && d.work) doneDays++;

    html += `
    <div class="card">
      <span>اليوم ${i+1}</span>
      <div>
        <button class="${d.study?'done':'not'}" onclick="toggle(${i},'study')">📚</button>
        <button class="${d.work?'done':'not'}" onclick="toggle(${i},'work')">💻</button>
      </div>
    </div>`;
  }

  document.getElementById("days").innerHTML = html;

  let percent = (doneDays / 21) * 100;
  document.getElementById("bar").style.width = percent + "%";
}

async function toggle(i,type){
  const ref = db.collection("users").doc(userId);
  const doc = await ref.get();

  let data = doc.exists ? doc.data().days : [];
  if(!data[i]) data[i]={study:false,work:false};

  data[i][type] = !data[i][type];

  await ref.set({days:data});
  load();
}

</script>

</body>
</html>
