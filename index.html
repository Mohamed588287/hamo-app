<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🔥 تحدي الانضباط</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  font-family:'Cairo';
  background: radial-gradient(circle at top, #0f172a, #020617);
  color:white;
  text-align:center;
}

.container {max-width:1000px;margin:auto;padding:20px;}

/* 🔥 HERO */
.hero {
  margin:20px;
  padding:50px;
  border-radius:20px;
  background: linear-gradient(135deg,#020617,#0f172a);
  box-shadow:0 0 40px rgba(34,197,94,0.3);
}

.hero h1 {font-size:32px;}
.hero button {
  background:#22c55e;
  color:black;
  font-weight:bold;
}

/* 📊 STATS */
.stats {
  display:flex;
  justify-content:space-around;
  margin:20px;
  flex-wrap:wrap;
}
.stat {
  background:#1e293b;
  padding:15px;
  border-radius:12px;
  box-shadow:0 0 15px rgba(34,197,94,0.2);
  margin:5px;
  transition:0.3s;
}
.stat:hover {
  transform:scale(1.05);
  box-shadow:0 0 20px #22c55e;
}

/* 🧊 CARD */
.card {
  background:rgba(30,41,59,0.6);
  backdrop-filter: blur(10px);
  border:1px solid rgba(34,197,94,0.2);
  margin:10px;
  padding:15px;
  border-radius:12px;
  display:flex;
  justify-content:space-between;
  transition:0.3s;
}
.card:hover {
  transform:translateY(-3px);
  box-shadow:0 5px 20px rgba(34,197,94,0.3);
}

button {
  padding:8px;
  border:none;
  border-radius:8px;
  cursor:pointer;
  margin:2px;
}
button:hover {
  box-shadow:0 0 15px #22c55e;
}

.done {background:#22c55e;}
.not {background:#ef4444;}

.progress {
  background:#334155;
  border-radius:10px;
  overflow:hidden;
  margin:20px;
}
.bar {
  height:20px;
  background:#22c55e;
  width:0%;
}

/* ✔ animation */
.check {
  margin-top:5px;
  font-size:22px;
  animation: pop 0.3s ease;
}
@keyframes pop {
  0% {transform: scale(0); opacity:0;}
  50% {transform: scale(1.3);}
  100% {transform: scale(1); opacity:1;}
}

/* 🎉 confetti */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  top: 0;
  animation: fall 1s linear forwards;
}
@keyframes fall {
  to {
    transform: translateY(100vh) rotate(360deg);
    opacity:0;
  }
}
</style>
</head>

<body>

<audio id="doneSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<!-- 🔥 HERO -->
<div class="hero">
  <h1>🚀 ابدأ انضباطك وغيّر حياتك</h1>
  <p>نظام بسيط يخليك تلتزم كل يوم</p>
  <button onclick="login()">ابدأ الآن</button>
</div>

<!-- 📊 STATS -->
<div class="stats">
  <div class="stat">🔥 التزام</div>
  <div class="stat">📅 متابعة</div>
  <div class="stat">💪 تطوير</div>
</div>

<div class="container">

<h1 id="title">🔥 تحدي الانضباط</h1>

<button onclick="login()">تسجيل بجوجل</button>

<p id="user"></p>
<h3 id="streak">🔥 Streak: 0</h3>

<div class="progress"><div id="bar" class="bar"></div></div>

<div id="stats"></div>

<div id="days"></div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyD7XzFMve-N8ALJPlxaBQM_iMZtbr05dCc",
  authDomain: "hamo-124d8.firebaseapp.com",
  projectId: "hamo-124d8"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let userId="";
let userData={};
let tasksArr=[
  {name:"مذاكرة",color:"#22c55e"},
  {name:"شغل",color:"#3b82f6"}
];

function login(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res=>{
    userId=res.user.uid;
    document.getElementById("user").innerText=res.user.email;
    load();
  });
}

function fireConfetti(){
  for(let i=0;i<20;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},100%,50%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),1000);
  }
}

async function load(){
  const doc=await db.collection("users").doc(userId).get();
  userData=doc.exists?doc.data():{};
  let data=userData.days||[];

  let html="";
  let done=0;

  for(let i=0;i<21;i++){
    let d=data[i]||{};
    html+=`<div class="card"><span>اليوم ${i+1}</span><div>`;

    tasksArr.forEach(t=>{
      html+=`
      <div style="display:inline-block;text-align:center;">
        <button class="${d[t.name]?'done':'not'}" onclick="toggle(${i},'${t.name}')">
          ${t.name}
        </button>
        <div class="check">${d[t.name]?"✔️":""}</div>
      </div>`;
      if(d[t.name]) done++;
    });

    html+=`</div></div>`;
  }

  document.getElementById("days").innerHTML=html;
  document.getElementById("bar").style.width=(done/(21*tasksArr.length)*100)+"%";
}

async function toggle(i,task){
  const ref=db.collection("users").doc(userId);
  let data=userData.days||[];
  if(!data[i]) data[i]={};

  let val=!data[i][task];
  data[i][task]=val;

  await ref.set({days:data},{merge:true});

  if(val){
    document.getElementById("doneSound").play();
    fireConfetti();
  }

  load();
}

</script>

</body>
</html>
