<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🔥</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:'Cairo';
  background:#0b0f1a;
  color:white;
}

/* 🔥 زرار منور */
.start-btn{
  font-size:26px;
  padding:18px 40px;
  border-radius:30px;
  background:#22c55e;
  color:black;
  font-weight:bold;
  transition:0.3s;
  box-shadow:0 0 20px #22c55e;
}
.start-btn:hover{
  transform:scale(1.1);
  box-shadow:0 0 40px #22c55e;
}

/* HERO */
.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:40px;
  background:white;
  color:black;
  border-radius:30px;
  margin:20px;
}

/* 👤 صور */
.users{
  display:flex;
  gap:10px;
  margin-top:10px;
}
.users img{
  width:40px;
  height:40px;
  border-radius:50%;
}

/* 📊 DASHBOARD */
.dashboard{
  display:flex;
  gap:15px;
  margin:20px;
  flex-wrap:wrap;
}

.box{
  flex:1;
  background:#111827;
  padding:20px;
  border-radius:15px;
  text-align:center;
  box-shadow:0 0 10px rgba(0,255,100,0.2);
}

/* APP */
.app{
  margin:20px;
  background:#111827;
  padding:20px;
  border-radius:20px;
}

.card{
  background:#1e293b;
  margin:10px;
  padding:10px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
}

.done{background:#22c55e;}
.not{background:#ef4444;}

.task-btn{
  font-size:16px;
  padding:10px;
}

.settings{
  display:none;
  background:#1e293b;
  padding:15px;
  border-radius:10px;
}
</style>

</head>

<body>

<audio id="doneSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<!-- HERO -->
<div class="hero">
  <div>
    <h1>ابدأ انضباطك وغيّر حياتك</h1>
    <button onclick="login()" class="start-btn">ابدأ الآن</button>

    <!-- 👤 مستخدمين -->
    <div class="users">
      <img src="https://i.pravatar.cc/40?img=1">
      <img src="https://i.pravatar.cc/40?img=2">
      <img src="https://i.pravatar.cc/40?img=3">
    </div>
  </div>
</div>

<!-- 📊 DASHBOARD -->
<div class="dashboard">
  <div class="box">
    <h3>📅 الأيام</h3>
    <p>21</p>
  </div>
  <div class="box">
    <h3>🔥 التقدم</h3>
    <p id="progress">0%</p>
  </div>
  <div class="box">
    <h3>✅ المهام</h3>
    <p id="doneCount">0</p>
  </div>
</div>

<!-- APP -->
<div class="app">

<button id="settingsBtn" onclick="toggleSettings()" style="display:none;">⚙️ إعدادات</button>

<div id="settings" class="settings">
  <input id="taskInput" placeholder="مهمة جديدة">
  <button onclick="addTask()">➕</button>
  <div id="taskList"></div>
  <button onclick="saveTasks()">💾 حفظ</button>
</div>

<p id="user"></p>
<div id="days"></div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyD7XzFMve-N8ALJPlxaBQM_iMZtbr05dCc",
  authDomain: "hamo-124d8.firebaseapp.com",
  projectId: "hamo-124d8"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

let userId="";
let tasks=["مذاكرة","شغل"];
let customTasks=[];

function login(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res=>{
    userId=res.user.uid;
    document.getElementById("user").innerText=res.user.email;
    document.getElementById("settingsBtn").style.display="inline-block";

    load();
    loadTasks();
  });
}

function toggleSettings(){
  let s=document.getElementById("settings");
  s.style.display = s.style.display=="none"?"block":"none";
}

function addTask(){
  let t=document.getElementById("taskInput").value;
  if(!t) return;
  customTasks.push(t);
  document.getElementById("taskInput").value="";
  renderTasks();
}

function renderTasks(){
  let html="";
  customTasks.forEach((t,i)=>{
    html+=`${t} ❌<br>`;
  });
  document.getElementById("taskList").innerHTML=html;
}

async function saveTasks(){
  await db.collection("users").doc(userId).set({tasks:customTasks},{merge:true});
  tasks=customTasks;
  load();
}

async function loadTasks(){
  let doc=await db.collection("users").doc(userId).get();
  let data=doc.exists?doc.data():{};
  customTasks=data.tasks||tasks;
  tasks=customTasks;
  renderTasks();
}

async function load(){
  let doc=await db.collection("users").doc(userId).get();
  let data=doc.exists?doc.data().days:[];

  let html="";
  let done=0;

  for(let i=0;i<21;i++){
    let d=data[i]||{};
    html+=`<div class="card"><span>اليوم ${i+1}</span><div>`;

    tasks.forEach(t=>{
      if(d[t]) done++;
      html+=`<button class="task-btn ${d[t]?'done':'not'}" onclick="toggle(${i},'${t}')">${t}</button>`;
    });

    html+=`</div></div>`;
  }

  document.getElementById("days").innerHTML=html;

  let total=21*tasks.length;
  let percent=Math.round((done/total)*100);

  document.getElementById("progress").innerText=percent+"%";
  document.getElementById("doneCount").innerText=done;
}

async function toggle(i,t){
  let ref=db.collection("users").doc(userId);
  let doc=await ref.get();
  let data=doc.exists?doc.data().days:[];

  if(!data[i]) data[i]={};
  data[i][t]=!data[i][t];

  await ref.set({days:data});
  load();
}

</script>

</body>
</html>
