<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>تحدي 21 يوم - نظام العادات المستمرة</title>
  <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  
  <style>
    /* 🎨 لم أغير أي شيء في التصميم ليبقى كما تحبه */
    :root {
      --bg: #0A0C1E; --panel: rgba(22, 26, 51, 0.6); --panel-solid: #161A33;
      --text: #EAF2FF; --muted: #8A98B5; --stroke: rgba(77, 127, 255, 0.2);
      --glow: rgba(77, 127, 255, 0.1); --neon: #4D7FFF; --neon-2: #C77EFF;
      --danger: #FF4D6D; --radius: 16px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: system-ui, -apple-system, "Noto Sans Arabic", sans-serif;
      background-color: var(--bg);
      background-image: radial-gradient(circle at 10% 10%, var(--glow) 0%, transparent 30%), radial-gradient(circle at 90% 80%, rgba(200, 120, 255, 0.1) 0%, transparent 40%), linear-gradient(rgba(255, 255, 255, 0.01) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.01) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text); line-height: 1.55; overflow-x: hidden;
    }
    .container { max-width: 1120px; margin: 0 auto; padding: 20px; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .card, .kpi, .task { animation: fadeIn 0.5s ease backwards; }
    .task { cursor: grab; }
    .task.sortable-ghost { background: rgba(77, 127, 255, 0.3); border-style: dashed; }
    .card { background: var(--panel); border: 1px solid var(--stroke); border-radius: var(--radius); backdrop-filter: blur(12px); overflow: hidden; }
    .topbar { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px; position: sticky; top: 15px; z-index: 100; }
    .topbar .logo { display: flex; align-items: center; gap: 10px; }
    .topbar .logo i { font-size: 28px; color: var(--neon); }
    #displayName { margin:0; font-size:18px; color: var(--text); }
    #userEmail { font-size: 12px; }
    .grid { margin-top: 20px; display: grid; gap: 20px; grid-template-columns: 1.2fr 0.8fr; }
    @media (max-width: 980px) { .grid { grid-template-columns: 1fr; } }
    .card header { padding: 16px 20px; border-bottom: 1px solid var(--stroke); display: flex; align-items: center; justify-content: space-between; }
    .card header h2 { font-size: 16px; margin: 0; display: flex; align-items: center; gap: 8px; }
    .card .body { padding: 20px; }
    .progress-circle { position: relative; width: 160px; height: 160px; margin: 20px auto; }
    .progress-circle svg { transform: rotate(-90deg); }
    .progress-circle circle { fill: none; stroke-width: 10; stroke-linecap: round; }
    .progress-circle .bg-circle { stroke: var(--stroke); }
    .progress-circle .fg-circle { stroke: url(#progressGradient); transition: stroke-dashoffset 1s ease; }
    .progress-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; }
    .progress-center .percent { font-size: 32px; font-weight: 800; }
    .progress-center .label { color: var(--muted); font-size: 12px; }
    .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 30px; }
    .kpi { background: rgba(0,0,0,0.2); padding: 15px; border-radius: 14px; border: 1px solid var(--stroke); text-align: center; }
    .kpi .value { font-size: 24px; font-weight: 700; display: block; }
    .kpi .value i { font-size: 20px; margin-right: 5px; vertical-align: middle; color: var(--neon); }
    .kpi .label { color: var(--muted); font-size: 12px; }
    .task { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; border-radius: 12px; border: 1px solid var(--stroke); background: rgba(0,0,0,0.15); margin-bottom: 10px; transition: all 0.2s; }
    .task:hover { transform: translateY(-2px); border-color: rgba(77, 127, 255, 0.4); }
    .task.done { border-color: rgba(77, 127, 255, 0.3); background: rgba(77, 127, 255, 0.05); }
    .task.done .title { text-decoration: line-through; color: var(--muted); }
    .task-left { display: flex; align-items: center; gap: 12px; }
    .task input[type="checkbox"] { appearance: none; width: 20px; height: 20px; border: 2px solid var(--stroke); border-radius: 6px; cursor: pointer; position: relative; transition: 0.2s; }
    .task input[type="checkbox"]:checked { background: var(--neon); border-color: var(--neon); }
    .task input[type="checkbox"]:checked::after { content: '\ecb3'; font-family: 'Boxicons'; font-size: 20px; color: var(--bg); position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .input { flex: 1; background: var(--panel-solid); border: 1px solid var(--stroke); color: var(--text); padding: 12px; border-radius: 12px; outline: none; transition: 0.2s; width: 100%; }
    .btn { border: 1px solid var(--stroke); background: var(--panel); color: var(--text); padding: 10px 16px; border-radius: 12px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; transition: 0.2s; }
    .btn.primary { background: var(--neon); border-color: var(--neon); color: var(--bg); }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .badge-grid { display:grid; grid-template-columns: repeat(auto-fit, minmax(60px, 1fr)); gap:15px; }
    .badge { text-align: center; padding: 15px 10px; border-radius: 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--stroke); filter: grayscale(1); opacity: 0.5; }
    .badge.active { filter: grayscale(0); opacity: 1; border-color: var(--neon-2); }
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); z-index: 1000; display: none; align-items: center; justify-content: center; }
    .modal-content { background: var(--panel-solid); border-radius: var(--radius); border: 1px solid var(--stroke); padding: 25px; width: 90%; max-width: 450px; }
    .form-group { margin-bottom: 20px; }
    .form-group label { display: block; color: var(--muted); margin-bottom: 8px; font-size: 14px; }
    .toast { position: fixed; bottom: 20px; left: 20px; padding: 15px 20px; border-radius: 12px; background: var(--panel-solid); border: 1px solid var(--neon); display: none; z-index: 1000; }
  </style>
</head>
<body>
  <svg width="0" height="0" style="position:absolute"><defs><linearGradient id="progressGradient" x1="0%" y1="0%" x2="0%" y2="100%"><stop offset="0%" stop-color="var(--neon-2)"/><stop offset="100%" stop-color="var(--neon)"/></linearGradient></defs></svg>
  
  <div class="container">
    <div class="topbar card">
        <div class="logo">
            <i class='bx bxs-rocket'></i>
            <div>
                <h2 id="displayName">تحدي الـ 21 يوماً</h2>
                <small id="userEmail" class="muted">بانتظار تسجيل الدخول...</small>
            </div>
        </div>
      <div class="actions" style="display: flex; gap: 10px;">
        <button id="btnGoogle" class="btn"><i class='bx bxl-google'></i><span>دخول</span></button>
        <button id="btnSettings" class="btn" style="display:none;"><i class='bx bx-cog'></i></button>
        <button id="btnLogout" class="btn" style="display:none;"><i class='bx bx-log-out'></i></button>
      </div>
    </div>

    <div class="grid">
      <main>
        <section class="card">
          <header><h2><i class='bx bx-pie-chart-alt-2'></i> لوحة التقدم</h2></header>
          <div class="body">
            <div class="progress-circle">
              <svg viewBox="0 0 36 36"><path class="bg-circle" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" /><path id="fg-circle" class="fg-circle" stroke-dasharray="0, 100" d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831" /></svg>
              <div class="progress-center"><span id="kpiPercent" class="percent">0%</span><span class="label">إجمالي التقدم</span></div>
            </div>
            <div class="kpis">
              <div class="kpi"><span class="value" id="kpiDay"><i class='bx bx-calendar-star'></i>1/21</span><span class="label">اليوم الحالي</span></div>
              <div class="kpi"><span class="value" id="kpiTodayProgress"><i class='bx bx-check-double'></i>0%</span><span class="label">إنجاز اليوم</span></div>
            </div>
          </div>
        </section>

        <section class="card" style="margin-top:20px;">
          <header><h2 id="tasks-header"><i class='bx bx-list-ul'></i> عادات التحدي</h2><div id="todayKey" class="btn" style="font-size:12px; padding:4px 12px;">اليوم 1</div></header>
          <div class="body"><div id="taskList"></div><div id="emptyState" style="text-align:center; padding:30px; color:var(--muted);"><i class='bx bx-moon' style="font-size:30px; display:block; margin-bottom:10px;"></i>لا توجد مهام بعد.</div></div>
        </section>
      </main>

      <aside style="display:flex; flex-direction:column; gap:20px;">
        <div class="card"><header><h2><i class='bx bx-plus-circle'></i> إضافة عادة ثابتة</h2></header><div class="body"><input id="taskTitle" class="input" placeholder="اكتب عادتك (ستظهر يومياً)..." /><button id="btnAddTask" class="btn primary" style="width:100%; margin-top:10px;" disabled><i class='bx bx-plus'></i> إضافة للتحدي</button></div></div>
        <div class="card"><header><h2><i class='bx bxs-award'></i> الأوسمة</h2></header><div class="body badge-grid"><div class="badge" id="badge-1"><span class="icon">🚀</span><small class="label">بداية</small></div><div class="badge" id="badge-7"><span class="icon">🔥</span><small class="label">7 أيام</small></div><div class="badge" id="badge-14"><span class="icon">💎</span><small class="label">14 يوم</small></div><div class="badge" id="badge-21"><span class="icon">👑</span><small class="label">البطل</small></div></div></div>
        <div class="card"><header><h2><i class='bx bx-slider-alt'></i> التحكم</h2></header><div class="body" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;"><button id="btnPrevDay" class="btn" disabled><i class='bx bx-left-arrow-alt'></i></button><button id="btnNextDay" class="btn" disabled><i class='bx bx-right-arrow-alt'></i></button><button id="btnReset" class="btn danger" style="grid-column: span 2;" disabled><i class='bx bx-reset'></i> تصفير التحدي</button></div></div>
      </aside>
    </div>
  </div>

  <!-- نافذة الإعدادات -->
  <div id="settingsModal" class="modal-overlay">
    <div class="modal-content">
      <h2><i class='bx bx-cog'></i>الإعدادات</h2>
      <div class="form-group"><label>اسم العرض</label><input type="text" id="inputDisplayName" class="input"></div>
      <div class="form-group"><label>مدة التحدي</label><input type="number" id="inputChallengeDuration" class="input" min="1"></div>
      <div style="display:flex; gap:10px;"><button id="btnSaveSettings" class="btn primary" style="flex:1;">حفظ</button><button id="btnCloseSettings" class="btn">إغلاق</button></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyD7XzFMve-N8ALJPlxaBQM_iMZtbr05dCc", authDomain: "hamo-124d8.firebaseapp.com",
      projectId: "hamo-124d8", storageBucket: "hamo-124d8.appspot.com",
      messagingSenderId: "487641126653", appId: "1:487641126653:web:6378be437f6d0cb94fd094"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const provider = new GoogleAuthProvider();
    const $ = (id) => document.getElementById(id);

    let currentUser = null, userData = null, sortable = null;
    const defaultSettings = { displayName: '', challengeDuration: 21, enableConfetti: true };

    function showToast(msg) { $("toast").textContent = msg; $("toast").style.display = "block"; setTimeout(() => $("toast").style.display = "none", 3000); }
    async function updateDB(doRender = true) { if (!currentUser) return; await updateDoc(doc(db, "users", currentUser.uid), userData); if(doRender) render(); }

    function render() {
      if (!userData) return;
      const settings = userData.settings || defaultSettings;
      const dIdx = userData.progress.dayIndex;
      const dKey = `day_${String(dIdx).padStart(2, '0')}`;
      
      $("displayName").textContent = settings.displayName || `تحدي ${settings.challengeDuration} يوماً`;
      $("userEmail").textContent = currentUser.email;
      $("kpiDay").innerHTML = `<i class='bx bx-calendar-star'></i>${dIdx}/${settings.challengeDuration}`;
      $("todayKey").textContent = `اليوم ${dIdx}`;

      // المهام الثابتة
      const masterTasks = userData.masterTasks || [];
      const completedToday = userData.dailyStatus?.[dKey] || [];

      // حساب التقدم لليوم
      const todayProgress = masterTasks.length ? Math.round((completedToday.length / masterTasks.length) * 100) : 0;
      $("kpiTodayProgress").innerHTML = `<i class='bx bx-check-double'></i>${todayProgress}%`;

      // حساب التقدم الإجمالي (بناءً على الأيام المكتملة)
      let totalCompletedAllDays = 0;
      Object.values(userData.dailyStatus || {}).forEach(list => totalCompletedAllDays += list.length);
      const totalPossible = masterTasks.length * settings.challengeDuration;
      const globalPercent = totalPossible ? Math.round((totalCompletedAllDays / totalPossible) * 100) : 0;
      $("kpiPercent").textContent = globalPercent + "%";

      const circle = $("fg-circle"); const r = 15.9155; const circ = 2 * Math.PI * r;
      circle.style.strokeDasharray = `${circ} ${circ}`;
      circle.style.strokeDashoffset = circ - (globalPercent / 100) * circ;

      // الأوسمة
      $("badge-1").classList.toggle("active", totalCompletedAllDays >= 1);
      $("badge-7").classList.toggle("active", dIdx >= 7);
      $("badge-14").classList.toggle("active", dIdx >= 14);
      $("badge-21").classList.toggle("active", dIdx >= 21 && globalPercent === 100);

      const listEl = $("taskList"); listEl.innerHTML = "";
      $("emptyState").style.display = masterTasks.length ? "none" : "block";

      masterTasks.forEach(task => {
        const isDone = completedToday.includes(task.id);
        const div = document.createElement("div"); div.className = `task ${isDone ? 'done' : ''}`; div.setAttribute('data-id', task.id);
        div.innerHTML = `<div class="task-left"><input type="checkbox" ${isDone ? 'checked' : ''}><span class="title">${task.title}</span></div><div class="task-actions"><button class="btn danger delete" style="padding:4px 8px; font-size:10px;"><i class='bx bx-trash'></i></button></div>`;
        
        div.querySelector("input").onchange = (e) => {
          if (!userData.dailyStatus) userData.dailyStatus = {};
          if (!userData.dailyStatus[dKey]) userData.dailyStatus[dKey] = [];
          
          if (e.target.checked) {
            userData.dailyStatus[dKey].push(task.id);
            if (settings.enableConfetti) confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 } });
          } else {
            userData.dailyStatus[dKey] = userData.dailyStatus[dKey].filter(id => id !== task.id);
          }
          updateDB();
        };

        div.querySelector(".delete").onclick = () => {
          if (confirm("حذف العادة سيحذفها من كل الأيام، هل أنت متأكد؟")) {
            userData.masterTasks = userData.masterTasks.filter(t => t.id !== task.id);
            // تنظيف السجل من هذه المهمة
            Object.keys(userData.dailyStatus).forEach(key => {
                userData.dailyStatus[key] = userData.dailyStatus[key].filter(id => id !== task.id);
            });
            updateDB();
          }
        };
        listEl.appendChild(div);
      });
    }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          userData = snap.data();
          // تحديث الهيكل القديم للجديد إذا لزم الأمر
          if (!userData.masterTasks) userData.masterTasks = [];
          if (!userData.dailyStatus) userData.dailyStatus = {};
        } else {
          userData = { masterTasks: [], dailyStatus: {}, progress: { dayIndex: 1 }, email: user.email, settings: { ...defaultSettings } };
          await setDoc(doc(db, "users", user.uid), userData);
        }
        $("btnGoogle").style.display = 'none'; $("btnLogout").style.display = 'inline-flex'; $("btnSettings").style.display = 'inline-flex';
        document.querySelectorAll("button, input").forEach(el => el.disabled = false);
        render();
      } else {
        location.reload(); // إعادة تحميل بسيطة لتصفير الواجهة
      }
    });

    $("btnGoogle").onclick = () => signInWithPopup(auth, provider);
    $("btnLogout").onclick = () => signOut(auth);
    $("btnAddTask").onclick = () => {
      const t = $("taskTitle").value.trim(); if (!t) return;
      userData.masterTasks.push({ id: Date.now(), title: t });
      $("taskTitle").value = ""; updateDB();
    };
    $("btnNextDay").onclick = () => { if (userData.progress.dayIndex < (userData.settings.challengeDuration || 21)) { userData.progress.dayIndex++; updateDB(); } };
    $("btnPrevDay").onclick = () => { if (userData.progress.dayIndex > 1) { userData.progress.dayIndex--; updateDB(); } };
    $("btnReset").onclick = () => { if (confirm("تصفير التحدي سيمسح كل الإنجازات، هل أنت متأكد؟")) { userData.dailyStatus = {}; userData.progress.dayIndex = 1; updateDB(); } };
    $("btnSettings").onclick = () => { $("inputDisplayName").value = userData.settings.displayName; $("inputChallengeDuration").value = userData.settings.challengeDuration; $("settingsModal").style.display='flex'; };
    $("btnCloseSettings").onclick = () => $("settingsModal").style.display='none';
    $("btnSaveSettings").onclick = () => { userData.settings.displayName = $("inputDisplayName").value; userData.settings.challengeDuration = parseInt($("inputChallengeDuration").value); updateDB(); $("settingsModal").style.display='none'; };
  </script>
</body>
</html>
