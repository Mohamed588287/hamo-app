<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🔥</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:'Cairo';
  background:#0b0f1a;
  color:white;
}

.nav{
  display:flex;
  justify-content:space-between;
  padding:15px 40px;
  background:#000;
  border-radius:50px;
  margin:20px;
}

.start-btn{
  font-size:24px;
  padding:18px 35px;
  border-radius:30px;
  background:#22c55e;
  color:black;
  font-weight:bold;
}

.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:40px;
  background:white;
  color:black;
  border-radius:30px;
  margin:20px;
}

.app{
  margin:20px;
  background:#111827;
  padding:20px;
  border-radius:20px;
}

.card{
  background:#1e293b;
  margin:10px;
  padding:10px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
}

.done{background:#22c55e;}
.not{background:#ef4444;}

.task-btn{
  font-size:16px;
  padding:10px;
}

.settings{
  display:none;
  background:#1e293b;
  padding:15px;
  border-radius:10px;
}

</style>

</head>

<body>

<audio id="doneSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<!-- NAV -->
<div class="nav"></div>

<!-- HERO -->
<div class="hero">
  <div>
    <h1>ابدأ انضباطك وغيّر حياتك</h1>
    <button onclick="login()" class="start-btn">ابدأ الآن</button>
  </div>
</div>

<!-- APP -->
<div class="app">

<button id="settingsBtn" onclick="toggleSettings()" style="display:none;">⚙️ إعدادات</button>

<div id="settings" class="settings">
  <input id="taskInput" placeholder="مهمة جديدة">
  <button onclick="addTask()">➕</button>
  <div id="taskList"></div>
  <button onclick="saveTasks()">💾 حفظ</button>
</div>

<p id="user"></p>
<div id="days"></div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyD7XzFMve-N8ALJPlxaBQM_iMZtbr05dCc",
  authDomain: "hamo-124d8.firebaseapp.com",
  projectId: "hamo-124d8"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

let userId="";
let tasks=["مذاكرة","شغل"];

function login(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res=>{
    userId=res.user.uid;
    document.getElementById("user").innerText=res.user.email;

    document.getElementById("settingsBtn").style.display="inline-block";

    load();
    loadTasks();
  });
}

function toggleSettings(){
  let s=document.getElementById("settings");
  s.style.display = s.style.display=="none"?"block":"none";
}

let customTasks=[];

function addTask(){
  let t=document.getElementById("taskInput").value;
  if(!t) return;
  customTasks.push(t);
  document.getElementById("taskInput").value="";
  renderTasks();
}

function renderTasks(){
  let html="";
  customTasks.forEach((t,i)=>{
    html+=`${t} <button onclick="deleteTask(${i})">❌</button><br>`;
  });
  document.getElementById("taskList").innerHTML=html;
}

function deleteTask(i){
  customTasks.splice(i,1);
  renderTasks();
}

async function saveTasks(){
  await db.collection("users").doc(userId).set({tasks:customTasks},{merge:true});
  tasks=customTasks;
  load();
}

async function loadTasks(){
  let doc=await db.collection("users").doc(userId).get();
  let data=doc.exists?doc.data():{};
  customTasks=data.tasks||tasks;
  tasks=customTasks;
  renderTasks();
}

async function load(){
  let doc=await db.collection("users").doc(userId).get();
  let data=doc.exists?doc.data().days:[];

  let html="";
  for(let i=0;i<21;i++){
    let d=data[i]||{};
    html+=`<div class="card"><span>اليوم ${i+1}</span><div>`;
    tasks.forEach(t=>{
      html+=`<button class="task-btn ${d[t]?'done':'not'}" onclick="toggle(${i},'${t}')">${t}</button>`;
    });
    html+=`</div></div>`;
  }

  document.getElementById("days").innerHTML=html;
}

async function toggle(i,t){
  let ref=db.collection("users").doc(userId);
  let doc=await ref.get();
  let data=doc.exists?doc.data().days:[];

  if(!data[i]) data[i]={};
  data[i][t]=!data[i][t];

  await ref.set({days:data});
  load();
}

</script>

</body>
</html>
