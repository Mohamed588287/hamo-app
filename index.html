<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🔥 تحدي الانضباط</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body {
  font-family:'Cairo';
  background:#0f172a;
  color:white;
  text-align:center;
}
.light {
  background:#f1f5f9;
  color:black;
}
.container {max-width:900px;margin:auto;padding:20px;}
.card {background:#1e293b;margin:10px;padding:15px;border-radius:12px;display:flex;justify-content:space-between;}
.light .card {background:#fff;}
button {padding:8px;border:none;border-radius:8px;cursor:pointer;margin:2px;}
.done {background:#22c55e;}
.not {background:#ef4444;}
.progress {background:#334155;border-radius:10px;overflow:hidden;margin:20px;}
.bar {height:20px;background:#22c55e;width:0%;}
.settings {display:none;background:#1e293b;padding:15px;border-radius:10px;}
.light .settings {background:#fff;}
.task-item {margin:5px;padding:5px;border-radius:5px;cursor:grab;}
</style>
</head>

<body>

<button onclick="toggleMode()">🌙</button>

<div class="container">

<h1 id="title">🔥 تحدي الانضباط</h1>

<button onclick="login()">تسجيل بجوجل</button>
<button onclick="toggleSettings()">⚙️ إعدادات</button>

<p id="user"></p>
<h3 id="streak">🔥 Streak: 0</h3>

<div class="progress"><div id="bar" class="bar"></div></div>

<div id="days"></div>

<div id="settings" class="settings">
  <h3>⚙️ الإعدادات</h3>

  <input id="daysInput" placeholder="عدد الأيام"><br><br>
  <input id="titleInput" placeholder="اسم التحدي"><br><br>

  <input id="taskName" placeholder="اسم المهمة">
  <input type="color" id="taskColor">
  <button onclick="addTask()">➕</button>

  <div id="tasksList"></div><br>

  <button onclick="saveSettings()">حفظ</button>
</div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyD7XzFMve-N8ALJPlxaBQM_iMZtbr05dCc",
  authDomain: "hamo-124d8.firebaseapp.com",
  projectId: "hamo-124d8"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.firestore();

let userId="";
let userData={};
let tasksArr=[];

function login(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res=>{
    userId=res.user.uid;
    document.getElementById("user").innerText=res.user.email;
    load();
  });
}

function toggleMode(){
  document.body.classList.toggle("light");
}

function toggleSettings(){
  let s=document.getElementById("settings");
  s.style.display=s.style.display=="none"?"block":"none";
}

function addTask(){
  let name=document.getElementById("taskName").value;
  let color=document.getElementById("taskColor").value;

  if(!name) return;

  tasksArr.push({name,color});
  document.getElementById("taskName").value="";
  renderTasks();
}

function renderTasks(){
  let html="";
  tasksArr.forEach((t,i)=>{
    html+=`
    <div class="task-item" draggable="true" ondragstart="drag(${i})">
      <span style="color:${t.color}">${t.name}</span>
      <button onclick="removeTask(${i})">❌</button>
    </div>`;
  });
  document.getElementById("tasksList").innerHTML=html;
}

function removeTask(i){
  tasksArr.splice(i,1);
  renderTasks();
}

let dragIndex;

function drag(i){ dragIndex=i; }

function drop(i){
  let temp=tasksArr[i];
  tasksArr[i]=tasksArr[dragIndex];
  tasksArr[dragIndex]=temp;
  renderTasks();
}

async function load(){
  const doc=await db.collection("users").doc(userId).get();
  userData=doc.exists?doc.data():{};

  let daysCount=userData.custom?.days||21;
  let title=userData.custom?.title||"🔥 تحدي الانضباط";

  tasksArr=userData.custom?.tasks||[
    {name:"مذاكرة",color:"#22c55e"},
    {name:"شغل",color:"#3b82f6"}
  ];

  renderTasks();

  document.getElementById("title").innerText=title;

  let data=userData.days||[];

  let html="";
  let done=0;
  let streak=0;

  for(let i=0;i<daysCount;i++){
    let d=data[i]||{};
    html+=`<div class="card"><span>اليوم ${i+1}</span><div>`;

    let complete=true;

    tasksArr.forEach(t=>{
      if(!d[t.name]) complete=false;
      html+=`<button style="background:${t.color}" class="${d[t.name]?'done':'not'}" onclick="toggle(${i},'${t.name}')">${t.name}</button>`;
    });

    if(complete){done++;streak++;} else streak=0;

    html+=`</div></div>`;
  }

  document.getElementById("days").innerHTML=html;
  document.getElementById("bar").style.width=(done/daysCount*100)+"%";
  document.getElementById("streak").innerText="🔥 Streak: "+streak;
}

async function toggle(i,task){
  const ref=db.collection("users").doc(userId);
  let data=userData.days||[];
  if(!data[i]) data[i]={};

  data[i][task]=!data[i][task];

  await ref.set({days:data},{merge:true});
  load();
}

async function saveSettings(){
  let days=document.getElementById("daysInput").value;
  let title=document.getElementById("titleInput").value;

  await db.collection("users").doc(userId).set({
    custom:{days:+days,title,tasks:tasksArr}
  },{merge:true});

  alert("تم الحفظ ✅");
  load();
}

</script>

</body>
</html>
