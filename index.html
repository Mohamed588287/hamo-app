<!doctype html>  
<html lang="ar" dir="rtl">  
<head>  
  <meta charset="utf-8" />  
  <meta name="viewport" content="width=device-width, initial-scale=1" />  
  <title>تحدي 21 يوم - SaaS Dashboard Ultimate</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- ✨ تمت إضافة مكتبة السحب والإفلات -->
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <style>  
    :root{  
      --bg:#070A0E;  
      --panel:#0B1220;  
      --text:#EAF2FF;  
      --muted:#9BB0CC;  
      --stroke:rgba(86,255,140,.18);  
      --neon:#39FF88;  
      --neon-2:#00E5FF;  
      --danger:#FF4D6D;  
      --radius:16px;  
    }  
    \*{box-sizing:border-box}  
    body{  
      margin:0; font-family: system-ui, -apple-system, "Noto Sans Arabic", sans-serif;  
      background: radial-gradient(900px 420px at 90% 5%, rgba(57,255,136,.1), transparent 55%), var(--bg);  
      color:var(--text); line-height:1.55; overflow-x: hidden;
    }  
    .container{max-width:1120px; margin:0 auto; padding:20px}  
    
    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .task { animation: fadeIn 0.3s ease; }

    /* ✨ تمت إضافة ستايل للسحب */
    .task.sortable-ghost { background: rgba(57,255,136,0.2); border-style: dashed; }
    .task.sortable-chosen { cursor: grabbing; }

    .topbar{  
      display:flex; align-items:center; justify-content:space-between;  
      padding:15px; background: rgba(11,18,32,.8); border:1px solid var(--stroke);  
      border-radius: var(--radius); backdrop-filter: blur(12px); position: sticky; top: 15px; z-index: 100;  
    }  
    
    .grid{ margin-top:20px; display:grid; gap:20px; grid-template-columns: 1.2fr 0.8fr; }  
    @media (max-width: 980px){ .grid{grid-template-columns: 1fr} }  
    .card{ background: rgba(11,18,32,0.7); border: 1px solid var(--stroke); border-radius: var(--radius); overflow:hidden; }  
    .card header{ padding:16px; border-bottom: 1px solid var(--stroke); display:flex; align-items:center; justify-content:space-between; }  
    .card .body{padding:20px}
    /* KPIs */
    .kpis{display:grid; grid-template-columns: repeat(2, 1fr); gap:12px; margin-bottom: 20px;}  
    .kpi-main{ grid-column: span 2; background: rgba(57,255,136,0.05); padding:20px; border-radius:14px; border: 1px solid rgba(57,255,136,0.2); }
    .kpi{ padding:15px; border-radius:14px; background: rgba(10,22,40,0.5); border:1px solid var(--stroke); text-align: center; }  
    .kpi .value{font-size:24px; font-weight:800; color: var(--neon); display:block;}
    /* Suggestion Menu Style */
    .suggest-box {
      margin-top: 10px; padding: 10px; background: rgba(0,229,255,0.05); 
      border: 1px dashed var(--neon-2); border-radius: 12px; display: none;
    }
    .suggest-group { margin-bottom: 10px; }
    .suggest-group label { font-size: 11px; color: var(--neon-2); display: block; margin-bottom: 5px; }
    .suggest-tags { display: flex; flex-wrap: wrap; gap: 6px; }
    .tag { 
      font-size: 11px; padding: 4px 10px; background: rgba(255,255,255,0.05); 
      border: 1px solid var(--stroke); border-radius: 20px; cursor: pointer; transition: 0.2s;
    }
    .tag:hover { background: var(--neon); color: var(--bg); border-color: var(--neon); }
    /* Buttons */
    .btn{  
      border:1px solid rgba(57,255,136,0.3); background: rgba(57,255,136,0.1);  
      color: var(--text); padding:10px 16px; border-radius:12px; font-weight:600;  
      cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition: 0.2s;
    }  
    .btn:hover:not(:disabled){ transform: translateY(-2px); border-color: var(--neon); background: rgba(57,255,136,0.2); }
    .btn.secondary{ border-color: var(--stroke); background: rgba(255,255,255,0.05); }
    .btn.danger{ border-color: var(--danger); background: rgba(255,77,109,0.1); }
    .btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .task{  
      display:flex; align-items:center; justify-content:space-between;  
      padding:14px; border-radius:14px; border:1px solid var(--stroke); background: rgba(10,22,40,0.3); margin-bottom: 10px;
      cursor: grab; /* ✨ تم تغيير مؤشر الماوس */
    }  
    .task.done { border-color: var(--neon); background: rgba(57,255,136,0.05); }
    .task.done .title { text-decoration: line-through; color: var(--muted); }
    .input{  
      flex:1; background: rgba(10,22,40,0.6); border:1px solid var(--stroke);  
      color: var(--text); padding:12px; border-radius:12px; outline:none;
    }
    .badge { 
      text-align: center; padding: 10px; border-radius: 12px; background: rgba(255,255,255,0.02); 
      filter: grayscale(1); opacity: 0.3; transition: 0.5s; border: 1px solid transparent;
    }
    .badge.active { filter: grayscale(0); opacity: 1; border-color: var(--neon); background: rgba(57,255,136,0.05); }
    .toast{  
      position: fixed; bottom: 20px; left: 20px; padding:15px; border-radius: 12px;  
      background: var(--panel); border:1px solid var(--neon); display:none; z-index: 1000;
    }
  </style>  
</head>
<body>  
  <div class="container">  
    <div class="topbar">  
      <div>
        <h1 style="margin:0; font-size:18px; color:var(--neon)">تحدي الـ 21 يوماً</h1>
        <small id="userEmail" class="muted">بانتظار تسجيل الدخول...</small>
      </div>
      <div class="actions">  
        <button id="btnGoogle" class="btn">دخول بجوجل</button>  
        <button id="btnLogout" class="btn secondary" disabled>خروج</button>  
      </div>  
    </div>
    <div class="grid">  
      <section class="card">  
        <header>  
          <h2 style="font-size:15px; margin:0">لوحة الإنجازات</h2>
          <div id="todayKey" class="btn secondary" style="font-size:12px; padding:4px 12px;">اليوم 1</div>
        </header>
        <div class="body">  
          <div class="kpis">  
            <div class="kpi-main">  
              <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
                <span>إجمالي التقدم</span>
                <span id="kpiPercent" style="color:var(--neon); font-weight:bold;">0%</span>
              </div>
              <div style="height:8px; background:rgba(255,255,255,0.1); border-radius:10px; overflow:hidden;">
                <div id="progressBar" style="width:0%; height:100%; background:var(--neon); transition:1s ease;"></div>
              </div>
            </div>  
            <div class="kpi">  
              <span class="value" id="kpiDay">1/21</span>  
              <small class="muted">اليوم الحالي</small>
            </div>  
            <div class="kpi">  
              <span class="value" id="kpiTodayProgress">0%</span>  
              <small class="muted">إنجاز اليوم</small>
            </div>  
          </div>
          <div class="taskList" id="taskList"></div>  
          <div id="emptyState" style="text-align:center; padding:30px; color:var(--muted);">لا توجد مهام حالياً.</div>  
        </div>  
      </section>
      <aside style="display:flex; flex-direction:column; gap:20px;">  
        <div class="card">
          <header><h2 style="font-size:14px; margin:0">إضافة مهمة</h2></header>
          <div class="body">
            <div style="display:flex; gap:8px;">
              <input id="taskTitle" class="input" placeholder="اكتب مهمتك هنا..." />  
              <button id="btnSuggest" class="btn secondary" title="اقتراح مهام">💡</button>
            </div>
            
            <div id="suggestBox" class="suggest-box">
              <div class="suggest-group">
                <label>🌍 مهام عامة</label>
                <div class="suggest-tags" id="tags-general"></div>
              </div>
              <div class="suggest-group">
                <label>👦 للأولاد</label>
                <div class="suggest-tags" id="tags-boys"></div>
              </div>
              <div class="suggest-group">
                <label>👧 للبنات</label>
                <div class="suggest-tags" id="tags-girls"></div>
              </div>
            </div>
            <button id="btnAddTask" class="btn" style="width:100%; margin-top:10px; justify-content:center;" disabled>+ إضافة المهمة</button>  
          </div>
        </div>
        <div class="card">
          <header><h2 style="font-size:14px; margin:0">الأوسمة</h2></header>
          <div class="body" style="display:grid; grid-template-columns: repeat(4, 1fr); gap:10px;">
            <div class="badge" id="badge-1">🚀<br><small style="font-size:8px">بداية</small></div>
            <div class="badge" id="badge-7">🔥<br><small style="font-size:8px">7 أيام</small></div>
            <div class="badge" id="badge-14">💎<br><small style="font-size:8px">14 يوم</small></div>
            <div class="badge" id="badge-21">👑<br><small style="font-size:8px">بطل</small></div>
          </div>
        </div>
        <div class="card">
          <div class="body" style="display:grid; grid-template-columns: 1fr 1fr; gap:10px;">
            <button id="btnPrevDay" class="btn secondary" disabled>السابق</button>  
            <button id="btnNextDay" class="btn secondary" disabled>التالي</button>  
            <button id="btnReset" class="btn danger" style="grid-column: span 2; justify-content:center;" disabled>تصفير التحدي</button>  
          </div>
        </div>
      </aside>  
    </div>  
  </div>
  <div class="toast" id="toast"></div>
  <script type="module">  
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";  
    import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-auth.js";  
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore.js";

    // Firebase Config
    const firebaseConfig = {  
      apiKey: "AIzaSyD7XzFMve-N8ALJPlxaBQM_iMZtbr05dCc",  
      authDomain: "hamo-124d8.firebaseapp.com",  
      projectId: "hamo-124d8",  
      storageBucket: "hamo-124d8.firebasestorage.app",  
      messagingSenderId: "487641126653",  
      appId: "1:487641126653:web:6378be437f6d0cb94fd094"  
    };

    const app = initializeApp(firebaseConfig);  
    const auth = getAuth(app);  
    const db = getFirestore(app);  
    const provider = new GoogleAuthProvider();  
    const $ = (id) => document.getElementById(id);

    let currentUser = null;  
    let userData = null;
    let sortable = null; // ✨ متغير لحفظ كائن السحب

    // --- Suggestion Data ---
    const suggestions = {
      general: \["شرب 8 أكواب ماء", "قراءة 5 صفحات", "مشي 15 دقيقة", "ترتيب السرير", "كتابة 3 نعم (امتنان)"\],
      boys: \["10 تمارين ضغط", "تعلم 5 كلمات لغة", "ترتيب درج مكركب", "صلاة الفجر/استيقاظ مبكر"\],
      girls: \["روتين عناية بالبشرة", "كتابة يوميات 5 دقايق", "مساعدة في المطبخ", "تأمل 10 دقائق"\]
    };

    function initSuggestions() {
      \['general', 'boys', 'girls'\].forEach(cat => {
        const container = $(\`tags-${cat}\`);
        suggestions\[cat\].forEach(text => {
          const span = document.createElement('span');
          span.className = 'tag';
          span.textContent = text;
          span.onclick = () => { $("taskTitle").value = text; $("suggestBox").style.display = 'none'; };
          container.appendChild(span);
        });
      });
    }

    // --- Core Functions ---
    function showToast(msg) {
      $("toast").textContent = msg; $("toast").style.display = "block";
      setTimeout(() => $("toast").style.display = "none", 3000);
    }

    async function updateDB() {
      if (!currentUser) return;
      await updateDoc(doc(db, "users", currentUser.uid), userData);
      render();
    }

    function render() {
      if (!currentUser) return;

      document.querySelectorAll("button:not(#btnGoogle)").forEach(b => b.disabled = false);
      $("userEmail").textContent = currentUser.email;

      const dIdx = userData.progress.dayIndex;
      const dKey = \`day\_${String(dIdx).padStart(2, '0')}\`;

      $("kpiDay").textContent = \`${dIdx}/21\`;
      $("todayKey").textContent = \`اليوم ${dIdx}\`;

      const tasks = userData.tasks\[dKey\] || \[\];
      const doneToday = tasks.filter(t => t.done).length;
      $("kpiTodayProgress").textContent = tasks.length ? Math.round((doneToday/tasks.length)\*100) + "%" : "0%";

      let total = 0, done = 0;
      Object.values(userData.tasks).forEach(list => { total += list.length; done += list.filter(t => t.done).length; });
      const global = total ? Math.round((done/total)\*100) : 0;
      $("kpiPercent").textContent = global + "%";
      $("progressBar").style.width = global + "%";

      // Badges
      if (done >= 1) $("badge-1").classList.add("active");
      if (dIdx >= 7 && done >= 5) $("badge-7").classList.add("active");
      if (dIdx >= 14) $("badge-14").classList.add("active");
      if (global === 100 && total > 5) $("badge-21").classList.add("active");

      const listEl = $("taskList");
      listEl.innerHTML = "";
      $("emptyState").style.display = tasks.length ? "none" : "block";

      tasks.forEach(task => {
        const div = document.createElement("div");
        div.className = \`task ${task.done ? 'done' : ''}\`;
        // ✨ تم إضافة data-id للتعرف على المهمة
        div.setAttribute('data-id', task.id); 
        div.innerHTML = \`
          <div style="display:flex; align-items:center; gap:10px;">
            <input type="checkbox" ${task.done ? 'checked' : ''}>
            <span class="title">${task.title}</span>
          </div>
          <div>
            <button class="btn secondary" style="padding:4px 8px; font-size:10px;">تعديل</button>
            <button class="btn danger" style="padding:4px 8px; font-size:10px;">حذف</button>
          </div>
        \`;

        div.querySelector("input").onchange = (e) => { 
          task.done = e.target.checked; 
          if (task.done) confetti({ particleCount: 100, spread: 70, origin: { y: 0.8 } });
          updateDB(); 
        };

        div.querySelectorAll("button")\[0\].onclick = () => { 
          const n = prompt("تعديل المهمة:", task.title); 
          if(n && n.trim() !== ''){ task.title = n.trim(); updateDB(); } 
        };
        div.querySelectorAll("button")\[1\].onclick = () => { 
          if(confirm("هل أنت متأكد من حذف المهمة؟")){ 
            userData.tasks\[dKey\] = tasks.filter(t => t.id !== task.id); 
            updateDB(); 
          } 
        };
        listEl.appendChild(div);
      });
    }

    // ✨ --- دالة لتفعيل السحب والإفلات ---
    function initSortable() {
      if (sortable) { sortable.destroy(); } // تدمير النسخة القديمة قبل إنشاء واحدة جديدة
      const listEl = $("taskList");
      sortable = new Sortable(listEl, {
        animation: 150, // سرعة الحركة
        ghostClass: 'sortable-ghost', // الكلاس الذي يطبق على العنصر الوهمي أثناء السحب
        chosenClass: 'sortable-chosen', // الكلاس الذي يطبق على العنصر عند اختياره
        onEnd: function (evt) {
          const dKey = \`day\_${String(userData.progress.dayIndex).padStart(2, '0')}\`;
          const currentTasks = userData.tasks\[dKey\] || \[\];
          
          // إعادة ترتيب المصفوفة بناءً على الترتيب الجديد في الـ DOM
          const newOrder = Array.from(evt.to.children).map(item => {
            const taskId = Number(item.getAttribute('data-id'));
            return currentTasks.find(t => t.id === taskId);
          });
          
          userData.tasks\[dKey\] = newOrder;
          // لا نเรียก render هنا، فقط نحدث قاعدة البيانات للحفاظ على الترتيب
          updateDoc(doc(db, "users", currentUser.uid), userData); 
        }
      });
    }

    // --- Events ---
    $("btnGoogle").onclick = () => signInWithPopup(auth, provider);
    $("btnLogout").onclick = () => { signOut(auth); location.reload(); };
    $("btnSuggest").onclick = () => { const s = $("suggestBox"); s.style.display = s.style.display === 'block' ? 'none' : 'block'; };
    
    $("btnAddTask").onclick = () => {
      const t = $("taskTitle").value.trim(); if (!t) return;
      const dKey = \`day\_${String(userData.progress.dayIndex).padStart(2, '0')}\`;
      if (!userData.tasks\[dKey\]) userData.tasks\[dKey\] = \[\];
      userData.tasks\[dKey\].push({ id: Date.now(), title: t, done: false });
      $("taskTitle").value = ""; updateDB();
    };

    $("btnNextDay").onclick = () => { if (userData.progress.dayIndex < 21) { userData.progress.dayIndex++; updateDB(); initSortable(); } };
    $("btnPrevDay").onclick = () => { if (userData.progress.dayIndex > 1) { userData.progress.dayIndex--; updateDB(); initSortable(); } };

    $("btnReset").onclick = async () => { if(confirm("هل أنت متأكد من تصفير كل شيء؟")){ userData.tasks = {}; userData.progress.dayIndex = 1; updateDB(); } };
    
    onAuthStateChanged(auth, async user => {
      if (user) {
        currentUser = user;
        $("btnGoogle").style.display = 'none';
        $("btnLogout").style.display = 'inline-flex';
        $("btnAddTask").disabled = false;
        
        const snap = await getDoc(doc(db, "users", user.uid));
        if (snap.exists()) {
          userData = snap.data();
        } else {
          userData = { tasks: {}, progress: { dayIndex: 1 }, email: user.email };
          await setDoc(doc(db, "users", user.uid), userData);
        }
        
        render();
        initSortable(); // ✨ تفعيل السحب والإفلات بعد تحميل البيانات
      } else {
        // حالة عدم تسجيل الدخول
        currentUser = null;
        userData = null;
        document.querySelectorAll("button:not(#btnGoogle)").forEach(b => b.disabled = true);
        $("btnGoogle").style.display = 'inline-flex';
        $("btnLogout").style.display = 'none';
        $("userEmail").textContent = 'بانتظار تسجيل الدخول...';
        $("taskList").innerHTML = '';
        $("emptyState").style.display = 'block';
      }
    });

    initSuggestions();
  </script>
</body>
</html>
