<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<title>🔥 تحدي الانضباط</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

<style>
body{
  margin:0;
  font-family:'Cairo';
  background:#0b0f1a;
  color:white;
}

/* NAV */
.nav{
  display:flex;
  justify-content:space-between;
  padding:15px 40px;
  background:#000;
  border-radius:50px;
  margin:20px;
}

/* HERO */
.hero{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:40px;
  background:white;
  color:black;
  border-radius:30px;
  margin:20px;
}
.hero h1{font-size:40px;}
.hero button{
  background:#22c55e;
  border:none;
  padding:10px 20px;
  border-radius:20px;
}

/* STATS */
.stats{
  display:flex;
  justify-content:space-around;
  background:#111827;
  padding:20px;
  border-radius:20px;
  margin:20px;
}

/* APP */
.app{
  margin:20px;
  background:#111827;
  padding:20px;
  border-radius:20px;
}

.card{
  background:#1e293b;
  margin:10px;
  padding:10px;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
}

.done{background:#22c55e;}
.not{background:#ef4444;}

.check{
  font-size:18px;
  animation:pop 0.3s;
}
@keyframes pop{
  0%{transform:scale(0);}
  100%{transform:scale(1);}
}

/* confetti */
.confetti{
  position:fixed;
  width:10px;
  height:10px;
  top:0;
  animation:fall 1s linear forwards;
}
@keyframes fall{
  to{transform:translateY(100vh);opacity:0;}
}
</style>

</head>

<body>

<audio id="doneSound" src="https://www.soundjay.com/buttons/sounds/button-3.mp3"></audio>

<!-- NAV -->
<div class="nav">
  <div>🔥 تحدي</div>
  <div>
    <button onclick="login()">تسجيل</button>
  </div>
</div>

<!-- HERO -->
<div class="hero">
  <div>
    <h1>ابدأ انضباطك وغيّر حياتك</h1>
    <button onclick="login()">ابدأ الآن</button>
  </div>
  <img src="https://i.imgur.com/7D7I6dI.png" width="250">
</div>

<!-- STATS -->
<div class="stats">
  <div>🔥 التزام</div>
  <div>📅 متابعة</div>
  <div>💪 تطوير</div>
</div>

<!-- APP -->
<div class="app">

<h2>لوحة التحدي</h2>
<p id="user"></p>

<div id="days"></div>

</div>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyD7XzFMve-N8ALJPlxaBQM_iMZtbr05dCc",
  authDomain: "hamo-124d8.firebaseapp.com",
  projectId: "hamo-124d8"
};

firebase.initializeApp(firebaseConfig);
const auth=firebase.auth();
const db=firebase.firestore();

let userId="";
let tasks=["مذاكرة","شغل"];

function login(){
  const provider=new firebase.auth.GoogleAuthProvider();
  auth.signInWithPopup(provider).then(res=>{
    userId=res.user.uid;
    document.getElementById("user").innerText=res.user.email;
    load();
  });
}

function fireConfetti(){
  for(let i=0;i<20;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.background=`hsl(${Math.random()*360},100%,50%)`;
    document.body.appendChild(c);
    setTimeout(()=>c.remove(),1000);
  }
}

async function load(){
  const doc=await db.collection("users").doc(userId).get();
  let data=doc.exists?doc.data().days:[];

  let html="";

  for(let i=0;i<21;i++){
    let d=data[i]||{};
    html+=`<div class="card"><span>اليوم ${i+1}</span><div>`;

    tasks.forEach(t=>{
      html+=`
      <div>
        <button class="${d[t]?'done':'not'}" onclick="toggle(${i},'${t}')">${t}</button>
        <div class="check">${d[t]?"✔️":""}</div>
      </div>`;
    });

    html+=`</div></div>`;
  }

  document.getElementById("days").innerHTML=html;
}

async function toggle(i,t){
  let ref=db.collection("users").doc(userId);
  let doc=await ref.get();
  let data=doc.exists?doc.data().days:[];

  if(!data[i]) data[i]={};

  let val=!data[i][t];
  data[i][t]=val;

  await ref.set({days:data});

  if(val){
    document.getElementById("doneSound").play();
    fireConfetti();
  }

  load();
}

</script>

</body>
</html>
